<section id="contact" class="py-5 bg-light">
    <div class="container py-5">
        <div class="row g-5">
            <!-- Contact Form -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <!-- Section Header -->
                    <div class="d-inline-flex align-items-center gap-2 px-3 py-2 rounded-pill mb-4"
                        style="background: rgba(var(--primary), 0.1)">
                        <i class="mdi mdi-email-fast text-primary"></i>
                        <span class="text-primary small fw-semibold">Get in Touch</span>
                    </div>

                    <h2 class="display-6 fw-bold mb-4">
                        Let's Discuss Your
                        <span class="text-gradient">Project</span>
                    </h2>

                    <form id="contactForm" class="needs-validation" novalidate>
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="name" placeholder="Your Name" required>
                                    <label for="name">Your Name</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" class="form-control" id="email" placeholder="Email Address"
                                        required>
                                    <label for="email">Email Address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="tel" class="form-control" id="phone" placeholder="Phone Number">
                                    <label for="phone">Phone Number</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <select class="form-select" id="service" required>
                                        <option value="" selected disabled>Select a Service</option>
                                        <option>Custom Software Development</option>
                                        <option>AI & Machine Learning</option>
                                        <option>Cloud Solutions</option>
                                        <option>Mobile App Development</option>
                                        <option>UI/UX Design</option>
                                        <option>Tech Consulting</option>
                                    </select>
                                    <label for="service">Service Required</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <textarea class="form-control" id="message" style="height: 150px"
                                        placeholder="Project Details" required></textarea>
                                    <label for="message">Project Details</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5">
                                    Send Message
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Contact Info -->
            <div class="col-lg-5">
                <!-- Contact Cards -->
                <div class="row g-4">
                    <div class="col-md-6 col-lg-12">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="d-flex gap-3">
                                <div class="feature-icon">
                                    <i class="mdi mdi-map-marker fs-3"></i>
                                </div>
                                <div>
                                    <h4 class="h5 mb-2">Visit Us</h4>
                                    <p class="text-gray-600 mb-0">
                                        123 Innovation Street<br>
                                        Tech Valley, CA 94103<br>
                                        United States
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-12">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="d-flex gap-3">
                                <div class="feature-icon">
                                    <i class="mdi mdi-phone fs-3"></i>
                                </div>
                                <div>
                                    <h4 class="h5 mb-2">Call Us</h4>
                                    <p class="text-gray-600 mb-2">
                                        <a href="tel:+1234567890" class="text-decoration-none text-gray-600">
                                            +1 (234) 567-890
                                        </a>
                                    </p>
                                    <p class="text-gray-600 mb-0">
                                        Mon - Fri: 9:00 AM - 6:00 PM
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-12">
                        <div class="card border-0 shadow-sm rounded-4 p-4">
                            <div class="d-flex gap-3">
                                <div class="feature-icon">
                                    <i class="mdi mdi-email fs-3"></i>
                                </div>
                                <div>
                                    <h4 class="h5 mb-2">Email Us</h4>
                                    <p class="text-gray-600 mb-0">
                                        <a href="mailto:info@spidertech.com" class="text-decoration-none text-gray-600">
                                            info@spidertech.com
                                        </a>
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Social Links -->
                <div class="mt-4">
                    <h4 class="h5 mb-3">Follow Us</h4>
                    <div class="d-flex gap-3">
                        <a href="#" class="btn btn-light rounded-circle p-2">
                            <i class="mdi mdi-linkedin text-primary fs-5"></i>
                        </a>
                        <a href="#" class="btn btn-light rounded-circle p-2">
                            <i class="mdi mdi-twitter text-primary fs-5"></i>
                        </a>
                        <a href="#" class="btn btn-light rounded-circle p-2">
                            <i class="mdi mdi-github text-primary fs-5"></i>
                        </a>
                        <a href="#" class="btn btn-light rounded-circle p-2">
                            <i class="mdi mdi-instagram text-primary fs-5"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .form-floating>.form-control,
    .form-floating>.form-select {
        height: calc(3.5rem + 2px);
        line-height: 1.25;
    }

    .form-floating>label {
        padding: 1rem 0.75rem;
    }

    .form-floating>.form-control:focus~label,
    .form-floating>.form-control:not(:placeholder-shown)~label,
    .form-floating>.form-select~label {
        transform: scale(0.85) translateY(-0.5rem) translateX(0.15rem);
    }

    .form-floating>textarea.form-control {
        height: 150px;
    }
</style>
